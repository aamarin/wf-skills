# workmux project configuration — wfctl standard starter.
# Repo-agnostic conventions; fill in project-specific hooks where noted.
# Global settings live in ~/.config/workmux/config.yaml.

#-------------------------------------------------------------------------------
# Naming & Paths
#-------------------------------------------------------------------------------
worktree_dir: wt          # worktrees land in ./wt/<handle> (gitignored by installer)
worktree_naming: full

# Per-project tmux session/window name prefix (workmux default: "wm-").
# window_prefix: "<project>__"

#-------------------------------------------------------------------------------
# Tmux
#-------------------------------------------------------------------------------
mode: session

windows:
  - name: agent
    panes:
      - command: <agent>
        focus: true
  - name: term
    panes:
      - command: ''

#-------------------------------------------------------------------------------
# Agent
#-------------------------------------------------------------------------------
agent: claude

#-------------------------------------------------------------------------------
# Hooks
#-------------------------------------------------------------------------------
# Require branch/handle to start with an issue number (e.g. 359-my-feature),
# matching wfctl's issue-number branch model. Aborts creation otherwise.
pre_create:
  - |
    ISSUE=$(echo "$WM_HANDLE" | grep -oE '^[0-9]+')
    if [[ -z "$ISSUE" ]]; then
      echo "Error: '$WM_HANDLE' must start with an issue number (e.g. 359-my-feature)."
      exit 1
    fi

# Project-specific setup (ports, .env rewrites, db URLs) goes here.
# Example — derive a port from the issue number and patch a .env:
# post_create:
#   - |
#     ISSUE=$(echo "$WM_HANDLE" | grep -oE '^[0-9]+')
#     sed -i '' "s|^PORT=.*|PORT=${ISSUE}|" "$WM_WORKTREE_PATH/.env"
#     exit 0

# specs/ and .agent/ are gitignored, so removing the worktree destroys the spec,
# plan, tasks and analysis with it. `wfctl archive-story` copies them into
# wfctl's per-branch state dir — flattened, numbered in pipeline order, with a
# generated index — so the story stays readable after the worktree is gone. It is
# a forensic snapshot, not a restorable tree.
#
# `command -v` guards a checkout without wfctl on PATH: a teardown hook must
# never be the thing that stops a worktree from being removed. The subcommand
# exits 0 on every internal failure for the same reason, so `|| true` is
# belt-and-braces rather than the only guard.
#
# Note this replaces workmux's own default, which auto-detects Node.js projects
# and fast-deletes node_modules. `pre_remove: []` had already given that up — an
# empty list is an explicit opt-out, not an absent default — so nothing is lost
# here that a seeded repo still had.
pre_remove:
  - command -v wfctl >/dev/null && wfctl archive-story "$WM_WORKTREE_PATH" "$WM_HANDLE" || true

#-------------------------------------------------------------------------------
# Files
#-------------------------------------------------------------------------------
# Files to copy into each new worktree (e.g. a gitignored .env):
# files:
#   copy:
#     - .env
